<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.summary | default: site.description | escape }}">
    <meta name="theme-color" content="#f7f4fa">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <script>
      try {
        const savedTheme = localStorage.getItem("support-theme");
        if (savedTheme === "light" || savedTheme === "dark") {
          document.documentElement.dataset.theme = savedTheme;
        }
      } catch (error) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
  </head>
  <body>
    <a class="skip-link" href="#contenido-principal">Saltar al contenido</a>
    <header class="site-header">
      <div class="site-header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Centro de Soporte Técnico, inicio">
          <span class="brand-mark" aria-hidden="true">ST</span>
          <span class="brand-copy">
            <span class="brand-name">Soporte técnico</span>
            <span class="brand-caption">Base de conocimiento</span>
          </span>
        </a>
        <nav class="header-nav" aria-label="Navegación principal">
          <a href="{{ '/' | relative_url }}">Inicio</a>
          {% if page.layout == 'article' %}
            <a class="nav-back" href="{{ '/' | relative_url }}#categorias">Categorías</a>
          {% endif %}
          <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false">
            <span class="theme-toggle-icon" aria-hidden="true">☀</span>
            <span class="theme-toggle-label">Modo claro</span>
          </button>
        </nav>
      </div>
    </header>

    <main id="contenido-principal">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="site-footer-inner">
        <span>Centro de Soporte Técnico</span>
        <span>Guías y referencias de consulta</span>
        <a class="footer-top-link" href="#contenido-principal">Volver arriba ↑</a>
      </div>
    </footer>
    <script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
  </body>
</html>
